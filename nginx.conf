server {
    listen 80;
    server_name localhost;

    # Backend cho phép 50MB/file, tối đa 5 file/lần nộp -> request ~250MB (mặc định nginx chỉ 1MB -> lỗi 413)
    client_max_body_size 260m;
    client_body_timeout 300s;

    # Khi có Caddy (HTTPS) phía trước: lấy IP thật của người dùng thay vì IP gateway Docker
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # File build của Vite có hash trong tên -> cache lâu dài trên trình duyệt
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
        proxy_send_timeout 300s;
    }
}